syntax = "proto3";

package end_device.v1;

import "google/protobuf/timestamp.proto";

// EndDevice represents a named, configured source of time-series data.
// End devices are scoped to organizations for multi-tenancy.
message EndDevice {
  // Server-generated unique identifier (UUID format)
  string end_device_id = 1;

  // Organization that owns this end device
  string organization_id = 2;

  // Reference to the EndDeviceDefinition
  string definition_id = 3;

  // Human-readable name for the end device
  string name = 4;

  // When the end device was created
  google.protobuf.Timestamp created_at = 5;

  // When the end device was last updated
  google.protobuf.Timestamp updated_at = 6;

  // Gateway this end device is connected to
  string gateway_id = 7;
}

// Request to create a new end device
// End device ID is generated server-side
message CreateEndDeviceRequest {
  // Organization that will own this end device
  string organization_id = 1;

  // Reference to the EndDeviceDefinition (required)
  string definition_id = 2;

  // Human-readable name for the end device
  string name = 3;

  // Gateway this end device connects to
  string gateway_id = 4;
}

// Response containing the newly created end device
message CreateEndDeviceResponse {
  // The created end device with server-generated ID and timestamps
  EndDevice end_device = 1;
}

// Request to get an end device by ID
message GetEndDeviceRequest {
  // Unique identifier of the end device to retrieve
  string end_device_id = 1;

  // Organization ID owning the end device
  string organization_id = 2;
}

// Response containing the requested end device
message GetEndDeviceResponse {
  // The requested end device
  EndDevice end_device = 1;
}

// Request to list all end devices for an organization
message ListEndDevicesRequest {
  // Organization ID to filter end devices by
  string organization_id = 1;
}

// Response containing end devices for the organization
message ListEndDevicesResponse {
  // List of end devices belonging to the organization
  repeated EndDevice end_devices = 1;
}

// Request to get all end devices connected to a gateway
message GetGatewayEndDevicesRequest {
  // Organization ID owning the gateway
  string organization_id = 1;

  // Gateway ID to filter end devices by
  string gateway_id = 2;
}

// Response containing end devices connected to the gateway
message GetGatewayEndDevicesResponse {
  // List of end devices connected to the gateway
  repeated EndDevice end_devices = 1;
}

// Service for managing end device lifecycle
service EndDeviceService {
  // Register a new end device
  rpc CreateEndDevice(CreateEndDeviceRequest) returns (CreateEndDeviceResponse);

  // Retrieve an end device by its ID
  rpc GetEndDevice(GetEndDeviceRequest) returns (GetEndDeviceResponse);

  // List all end devices for an organization
  rpc ListEndDevices(ListEndDevicesRequest) returns (ListEndDevicesResponse);

  // Get all end devices connected to a gateway
  rpc GetGatewayEndDevices(GetGatewayEndDevicesRequest) returns (GetGatewayEndDevicesResponse);
}
